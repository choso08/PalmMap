name: Build offline maps

# Cuts countries from the Protomaps world map and publishes the files in a
# Release, so the app can download them and use them offline.
#
# The regions are in map-regions.json, at the repository root. To add a country,
# add a line there and run this with its id.
#
# Why this is legitimate, unlike downloading OpenStreetMap tiles: Protomaps
# publishes the whole planet precisely to be cut like this, and `pmtiles
# extract` reads only the pieces it needs. Dozens of requests, instead of the
# thousands it would take tile by tile.
#
# **Generated in batches, not all at once.** The catalogue has the whole world
# and is many gigabytes; a run trying to do everything would exhaust the
# server's disk and the six-hour limit. So the wanted ids are given, and each
# run **adds** to what is already there instead of replacing it.
#
# How to use: "Actions" tab > "Build offline maps" > "Run workflow", and type
# the ids separated by spaces. For example: `franca espanha italia`.

on:
  # Every 1st of the month, at 4 a.m. OpenStreetMap changes every day — roads
  # open, names change, places appear — and a map stored on the phone ages
  # without anyone noticing. Once a month is enough: the changes trickle in, it
  # is not a new map each time.
  #
  # **Without `regioes`, it redoes exactly the ones already published** — not
  # the catalogue's 90. See the note in the cutting step.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      regioes:
        description: 'Space-separated ids (see map-regions.json). "todas" only if you know what you are doing.'
        default: 'portugal'
        required: true
      apenas_negocios:
        description: 'Only (re)build the business files, keeping the published maps as they are'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # osmium cuts and filters the Geofabrik extracts for the business files.
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null && osmium --version | head -1

      - name: Install pmtiles
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep -oP '"tag_name": "v\K[^"]+')
          echo "pmtiles $VERSION"
          curl -sSL -o pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${VERSION}/go-pmtiles_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf pmtiles.tar.gz pmtiles
          chmod +x pmtiles
          ./pmtiles version

      # Protomaps builds are daily, at an address with the date. Go back until
      # one exists, because today's may not be ready when this runs.
      - name: Find the latest planet build
        run: |
          for i in $(seq 0 10); do
            DAY=$(date -u -d "-$i day" +%Y%m%d)
            URL="https://build.protomaps.com/${DAY}.pmtiles"
            if curl -sSI -o /dev/null -w '%{http_code}' "$URL" | grep -q '^200$'; then
              echo "PLANET=$URL" >> "$GITHUB_ENV"
              echo "Encontrada: $URL"
              exit 0
            fi
            echo "Does not exist: $URL"
          done
          echo "No build found in the last 10 days."
          exit 1

      # Each region is cut, uploaded and deleted right after. Without that, a big
      # batch filled the server's disk halfway and all the work was lost — there
      # are only about 20 GB free, and some countries are over 1 GB each.
      - name: Cut and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PEDIDAS: ${{ inputs.regioes }}
          APENAS_NEGOCIOS: ${{ inputs.apenas_negocios }}
        run: |
          set -o pipefail
          mkdir -p mapas

          # A scheduled run has no `regioes`: the month turned and nobody typed
          # anything. Then **the ones already published** are redone, which are
          # the ones someone may have on their phone — not the catalogue's 90,
          # which would be days of work and over 100 GB.
          # The published list, needed both by a scheduled run and by a
          # business-files-only run (which keeps each map's entry as it is).
          gh release download mapas -R "$REPO" -p mapas.json -O atuais.json 2>/dev/null || true

          if [ -z "$PEDIDAS" ]; then
            if [ -f atuais.json ]; then
              PEDIDAS=$(jq -r '.regioes[].id' atuais.json | tr '\n' ' ')
              echo "Scheduled run: redoing what is already published — $PEDIDAS"
            fi
            if [ -z "$PEDIDAS" ]; then
              echo "Nothing published yet and nothing asked. Nothing to do."
              exit 0
            fi
          fi

          # The Release has to exist before anything is uploaded to it.
          if ! gh release view mapas -R "$REPO" > /dev/null 2>&1; then
            gh release create mapas -R "$REPO" --title "Offline maps" --notes "Generating…"
          fi

          echo '{"regioes":[' > manifesto.tmp
          PRIMEIRA=1
          FALHADAS=""

          for ID in $(jq -r '.regioes[].id' map-regions.json); do
            if [ "$PEDIDAS" != "todas" ] && ! echo " $PEDIDAS " | grep -q " $ID "; then
              continue
            fi

            NOME=$(jq -r ".regioes[] | select(.id==\"$ID\") | .nome" map-regions.json)
            BBOX=$(jq -r ".regioes[] | select(.id==\"$ID\") | .bbox" map-regions.json)
            MAXZOOM=$(jq -r ".regioes[] | select(.id==\"$ID\") | .maxzoom" map-regions.json)

            GEOFABRIK=$(jq -r ".regioes[] | select(.id==\"$ID\") | .geofabrik // empty" map-regions.json)

            echo "::group::$NOME ($BBOX, zoom $MAXZOOM)"

            if [ "$APENAS_NEGOCIOS" = "true" ]; then
              # Keep the published map entry exactly as it is.
              ENTRY=$(jq -c ".regioes[] | select(.id==\"$ID\")" atuais.json 2>/dev/null)
              if [ -z "$ENTRY" ]; then
                echo "Not published yet, skipped: $NOME"
                echo "::endgroup::"
                continue
              fi
            else
              # One failing region must not take the whole batch down.
              if ! ./pmtiles extract "$PLANET" "mapas/${ID}.pmtiles" \
                   --bbox="$BBOX" --maxzoom="$MAXZOOM"; then
                echo "FALHOU: $NOME"
                FALHADAS="$FALHADAS $ID"
                rm -f "mapas/${ID}.pmtiles"
                echo "::endgroup::"
                continue
              fi

              BYTES=$(stat -c%s "mapas/${ID}.pmtiles")
              echo "$NOME: $(numfmt --to=iec "$BYTES")"

              # GitHub refuses files over 2 GB in a Release.
              if [ "$BYTES" -gt 2000000000 ]; then
                echo "TOO BIG for a Release. Lower the maxzoom in map-regions.json."
                FALHADAS="$FALHADAS $ID(grande)"
                rm -f "mapas/${ID}.pmtiles"
                echo "::endgroup::"
                continue
              fi

              gh release upload mapas "mapas/${ID}.pmtiles" -R "$REPO" --clobber
              rm -f "mapas/${ID}.pmtiles"

              # The bbox goes in the manifest because the app needs it to know
              # whether it is inside a stored country — without a network.
              # The date goes in the manifest so the app knows the file on the
              # phone is older than the one published.
              ENTRY=$(printf '{"id":"%s","nome":"%s","ficheiro":"%s.pmtiles","bytes":%s,"maxzoom":%s,"bbox":[%s],"gerado":"%s"}' \
                "$ID" "$NOME" "$ID" "$BYTES" "$MAXZOOM" "$BBOX" "$(date -u +%Y-%m-%d)")
            fi

            # **Every named business, for use without network.** From
            # Geofabrik's extract (published to be downloaded whole), never from
            # Overpass. A failure here only leaves the country without the
            # file; the map is already up. The extract is kept between regions
            # that share it (Portugal, Madeira and the Azores).
            if [ -n "$GEOFABRIK" ]; then
              PBF="osm/$(echo "$GEOFABRIK" | tr '/' '_').osm.pbf"
              mkdir -p osm
              if [ ! -f "$PBF" ]; then
                rm -f osm/*.osm.pbf
                curl -sSfL -A "PalmMap map builder (github.com/$REPO)" \
                  -o "$PBF" "https://download.geofabrik.de/${GEOFABRIK}-latest.osm.pbf" || rm -f "$PBF"
              fi
              if [ -f "$PBF" ] \
                && osmium extract -b "$BBOX" -s simple "$PBF" -o "osm/${ID}.pbf" --overwrite \
                && osmium tags-filter "osm/${ID}.pbf" nwr/amenity nwr/shop nwr/tourism nwr/leisure \
                     nwr/office nwr/craft nwr/healthcare n/entrance -o "osm/${ID}-f.pbf" --overwrite \
                && osmium export "osm/${ID}-f.pbf" -f geojsonseq --add-unique-id=type_id \
                     -o "osm/${ID}.geojsonseq" --overwrite \
                && python3 scripts/build-pois.py "osm/${ID}.geojsonseq" "$BBOX" "mapas/${ID}.pois"; then
                POIS_BYTES=$(stat -c%s "mapas/${ID}.pois")
                gh release upload mapas "mapas/${ID}.pois" -R "$REPO" --clobber
                ENTRY=$(echo "$ENTRY" | jq -c --arg f "${ID}.pois" --argjson b "$POIS_BYTES" \
                  --arg g "$(date -u +%Y-%m-%d)" '. + {negocios: $f, negociosBytes: $b, negociosGerado: $g}')
              else
                echo "::warning::No business file for $NOME"
              fi
              rm -f "osm/${ID}.pbf" "osm/${ID}-f.pbf" "osm/${ID}.geojsonseq" "mapas/${ID}.pois"
            fi

            [ $PRIMEIRA -eq 0 ] && echo ',' >> manifesto.tmp
            PRIMEIRA=0
            echo "$ENTRY" >> manifesto.tmp

            echo "::endgroup::"
          done

          echo ']}' >> manifesto.tmp
          jq . manifesto.tmp > lote.json

          if [ -n "$FALHADAS" ]; then
            echo "::warning::Regions that did not come out:$FALHADAS"
          fi

      # The manifest is the list the app reads. What was already there is merged
      # with this batch's, otherwise generating France would erase Portugal.
      - name: Update the list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release download mapas -R "$REPO" -p mapas.json -O anterior.json 2>/dev/null; then
            echo "Already there: $(jq '.regioes | length' anterior.json) region(s)."
          else
            echo '{"regioes":[]}' > anterior.json
          fi

          # On a repeat, this batch's wins: a regenerated map has a new size.
          jq -s '{regioes: (.[0].regioes + .[1].regioes)
                    | group_by(.id)
                    | map(.[-1])
                    | sort_by(.nome)}' anterior.json lote.json > mapas.json

          echo "Now: $(jq '.regioes | length' mapas.json) region(s)."
          jq -r '.regioes[] | "  \(.nome): \(.bytes/1048576 | floor) MB"' mapas.json

          gh release upload mapas mapas.json -R "$REPO" --clobber

          gh release edit mapas -R "$REPO" \
            --title "Offline maps" \
            --notes "Vector maps for use without a network, cut from the Protomaps world map.

          Each country is a single file. The app downloads them in Settings, under \"Country maps\".

          $(jq -r '.regioes[] | "- \(.nome): \(.bytes/1048576 | floor) MB (zoom \(.maxzoom))"' mapas.json)"
