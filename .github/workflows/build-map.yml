name: Gerar mapa offline

# Recorta países inteiros do mapa mundial do Protomaps e publica os ficheiros
# numa Release, para a aplicação os poder descarregar e usar sem rede.
#
# As regiões estão em map-regions.json, na raiz do repositório. Para acrescentar
# um país, junta-se uma linha lá e corre-se isto outra vez.
#
# Porque é que isto é legítimo, ao contrário de descarregar tiles do
# OpenStreetMap: o Protomaps publica o planeta inteiro precisamente para ser
# recortado assim, e o `pmtiles extract` lê só os pedaços de que precisa. São
# dezenas de pedidos, em vez dos milhares que seriam tile a tile.
#
# Como usar: separador "Actions" > "Gerar mapa offline" > "Run workflow".

on:
  workflow_dispatch:
    inputs:
      regioes:
        description: 'Que regiões gerar (ids separados por espaços, ou "todas")'
        default: 'todas'
        required: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o pmtiles
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep -oP '"tag_name": "v\K[^"]+')
          echo "pmtiles $VERSION"
          curl -sSL -o pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${VERSION}/go-pmtiles_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf pmtiles.tar.gz pmtiles
          chmod +x pmtiles
          ./pmtiles version

      # As compilações do Protomaps são diárias e ficam num endereço com a data.
      # Recua-se até encontrar uma que exista, porque a de hoje pode ainda não
      # estar pronta à hora a que isto corre.
      - name: Descobrir a compilação mais recente do planeta
        run: |
          for i in $(seq 0 10); do
            DAY=$(date -u -d "-$i day" +%Y%m%d)
            URL="https://build.protomaps.com/${DAY}.pmtiles"
            if curl -sSI -o /dev/null -w '%{http_code}' "$URL" | grep -q '^200$'; then
              echo "PLANET=$URL" >> "$GITHUB_ENV"
              echo "Encontrada: $URL"
              exit 0
            fi
            echo "Não existe: $URL"
          done
          echo "Nenhuma compilação encontrada nos últimos 10 dias."
          exit 1

      - name: Recortar as regiões
        env:
          PEDIDAS: ${{ inputs.regioes }}
        run: |
          mkdir -p mapas
          # O manifesto é o que a aplicação lê para saber o que há e que tamanho tem.
          echo '{"regioes":[' > manifesto.tmp
          PRIMEIRA=1

          for ID in $(jq -r '.regioes[].id' map-regions.json); do
            if [ "$PEDIDAS" != "todas" ] && ! echo " $PEDIDAS " | grep -q " $ID "; then
              echo "A saltar $ID"
              continue
            fi

            NOME=$(jq -r ".regioes[] | select(.id==\"$ID\") | .nome" map-regions.json)
            BBOX=$(jq -r ".regioes[] | select(.id==\"$ID\") | .bbox" map-regions.json)
            MAXZOOM=$(jq -r ".regioes[] | select(.id==\"$ID\") | .maxzoom" map-regions.json)

            echo "::group::$NOME ($BBOX, zoom $MAXZOOM)"
            ./pmtiles extract "$PLANET" "mapas/${ID}.pmtiles" \
              --bbox="$BBOX" --maxzoom="$MAXZOOM"

            BYTES=$(stat -c%s "mapas/${ID}.pmtiles")
            echo "$NOME: $(numfmt --to=iec "$BYTES")"
            echo "::endgroup::"

            [ $PRIMEIRA -eq 0 ] && echo ',' >> manifesto.tmp
            PRIMEIRA=0
            # O bbox vai no manifesto porque a aplicação precisa dele para saber
            # se está dentro de um país guardado — e precisa de o saber sem rede.
            printf '{"id":"%s","nome":"%s","ficheiro":"%s.pmtiles","bytes":%s,"maxzoom":%s,"bbox":[%s]}' \
              "$ID" "$NOME" "$ID" "$BYTES" "$MAXZOOM" "$BBOX" >> manifesto.tmp
          done

          echo ']}' >> manifesto.tmp
          jq . manifesto.tmp > mapas/mapas.json
          cat mapas/mapas.json

      # Publica-se sempre na mesma etiqueta, 'mapas'. Assim a aplicação sabe o
      # endereço de cor e não tem de andar à procura da Release mais recente.
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # -R é preciso mesmo com checkout, para não depender da pasta atual.
          gh release delete mapas -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "mapas" mapas/* \
            -R "${{ github.repository }}" \
            --title "Mapas offline" \
            --notes "Mapas vetoriais para usar sem rede, gerados a partir do mapa mundial do Protomaps.

          $(jq -r '.regioes[] | "- \(.nome): \(.bytes/1048576 | floor) MB (zoom \(.maxzoom))"' mapas/mapas.json)"
