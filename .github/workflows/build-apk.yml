name: Build APK

# Builds the app on GitHub's servers and publishes the APK in a Release, so it
# can be downloaded and installed straight on the phone.
#
# Como usar: separador "Actions" > "Compilar APK" > "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags: without them there is no way to know
          # what changed since the previous build, and the list would be empty.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # The version comes from here, not from anyone's hand.
      #
      # `app.json` keeps only the meaningful part — the 7.0 of "version 7" — and
      # the last number is the build's. So **there are never two with the same
      # version**, whatever happens: there were once five in a row all saying the
      # same, because it depended on someone remembering to edit the file.
      #
      # The `versionCode` is the same thing for Android: without a new number, it
      # refuses to install over a previous version.
      - name: Number this version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const [maior, menor] = String(app.expo.version).split('.');
            app.expo.version = maior + '.' + menor + '.' + process.env.RUN_NUMBER;
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('This build\'s version: ' + app.expo.version);
          "

      # The android/ folder is not in the repository — Expo generates it.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Only arm64-v8a: the processor of every current Android phone. Including
      # all four architectures tripled the file size for no benefit, and a huge
      # APK is more likely to arrive truncated.
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Confirms the APK came out whole and properly signed. Without this, a broken
      # file is only found on the phone, with a "problem parsing the package".
      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -t "$APK" > /dev/null && echo "Archive intact."

          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- identification ---"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|native-code"
          echo "--- signature ---"
          "$TOOLS/apksigner" verify --print-certs -v "$APK"

      # The list of what changed since the previous build, taken from the commits.
      #
      # The previous build's tag is found by number — `apk-9` and `apk-10` do not
      # sort right as text, so they are sorted by the number after the dash.
      - name: Gather what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANTERIOR=$(gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("apk-"))' \
            | sort -t- -k2 -n | tail -1)

          if [ -n "$ANTERIOR" ] && git rev-parse "$ANTERIOR" > /dev/null 2>&1; then
            echo "Since $ANTERIOR:"
            # Only each commit's subject, without maintenance ones. `--no-merges`
            # removes the noise of branch merges.
            git log --no-merges --pretty=format:'- %s' "$ANTERIOR..HEAD" \
              | grep -viE '^- (merge|bump|wip|typo|formatar)' > MUDANCAS.md || true
          else
            echo "No identifiable previous build — first list."
            git log --no-merges --pretty=format:'- %s' -20 > MUDANCAS.md || true
          fi

          if [ ! -s MUDANCAS.md ]; then
            echo "- No code changes since the previous build." > MUDANCAS.md
          fi

          echo "ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"
          cat MUDANCAS.md

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk PalmMap.apk
          SIZE=$(du -h PalmMap.apk | cut -f1)
          SHA=$(sha256sum PalmMap.apk | cut -c1-16)
          VERSAO=$(jq -r '.expo.version' app.json)

          {
            echo "## What changed"
            echo
            cat MUDANCAS.md
            echo
            echo "## Install"
            echo
            echo "Download \`PalmMap.apk\` below and open it on the phone."
            echo "It is the full app: it installs over the previous one without losing"
            echo "settings, saved places or downloaded maps."
            echo
            echo "Version $VERSAO · $SIZE · SHA-256 starts with \`$SHA\`"
            if [ -n "$ANTERIOR" ]; then
              echo
              echo "Full changes: https://github.com/${{ github.repository }}/compare/$ANTERIOR...apk-${{ github.run_number }}"
            fi
          } > NOTAS.md

          gh release create "apk-${{ github.run_number }}" PalmMap.apk \
            --title "PalmMap $VERSAO" \
            --notes-file NOTAS.md
