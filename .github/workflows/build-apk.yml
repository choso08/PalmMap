name: Build APK

# Builds the app on GitHub's servers and publishes the APK in a Release, so it
# can be downloaded and installed straight on the phone.
#
# Como usar: separador "Actions" > "Compilar APK" > "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: write
  # To sign the build provenance (see "Prove where the APK came from").
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags: without them there is no way to know
          # what changed since the previous build, and the list would be empty.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # The version comes from here, not from anyone's hand.
      #
      # `app.json` keeps only the meaningful part — the 7.0 of "version 7" — and
      # the last number is the build's. So **there are never two with the same
      # version**, whatever happens: there were once five in a row all saying the
      # same, because it depended on someone remembering to edit the file.
      #
      # The `versionCode` is the same thing for Android: without a new number, it
      # refuses to install over a previous version.
      - name: Number this version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const [maior, menor] = String(app.expo.version).split('.');
            app.expo.version = maior + '.' + menor + '.' + process.env.RUN_NUMBER;
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('This build\'s version: ' + app.expo.version);
          "

      # The android/ folder is not in the repository — Expo generates it.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Only arm64-v8a: the processor of every current Android phone. Including
      # all four architectures tripled the file size for no benefit, and a huge
      # APK is more likely to arrive truncated.
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Confirms the APK came out whole and properly signed. Without this, a broken
      # file is only found on the phone, with a "problem parsing the package".
      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -t "$APK" > /dev/null && echo "Archive intact."

          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- identification ---"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|native-code"
          echo "--- signature ---"
          "$TOOLS/apksigner" verify --print-certs -v "$APK"

      # The list of what changed since the previous build, taken from the commits.
      #
      # The previous build's tag is found by number — `apk-9` and `apk-10` do not
      # sort right as text, so they are sorted by the number after the dash.
      - name: Gather what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANTERIOR=$(gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("apk-"))' \
            | sort -t- -k2 -n | tail -1)

          if [ -n "$ANTERIOR" ] && git rev-parse "$ANTERIOR" > /dev/null 2>&1; then
            echo "Since $ANTERIOR:"
            # Only each commit's subject, without maintenance ones. `--no-merges`
            # removes the noise of branch merges.
            git log --no-merges --pretty=format:'- %s' "$ANTERIOR..HEAD" \
              | grep -viE '^- (merge|bump|wip|typo|formatar)' > MUDANCAS.md || true
          else
            echo "No identifiable previous build — first list."
            git log --no-merges --pretty=format:'- %s' -20 > MUDANCAS.md || true
          fi

          if [ ! -s MUDANCAS.md ]; then
            echo "- No code changes since the previous build." > MUDANCAS.md
          fi

          echo "ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"
          cat MUDANCAS.md

      - name: Name the APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk PalmMap.apk
          echo "APK_SHA256=$(sha256sum PalmMap.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # A signed statement, kept by GitHub, that this exact file (by its
      # SHA-256) was built by this workflow from this commit of this repository
      # (author's request, November 2026: "how do people know it has no virus?").
      # Anyone can check it: `gh attestation verify PalmMap.apk -R <owner>/<repo>`.
      # Nobody without write access to the repository can make one.
      - name: Prove where the APK came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: PalmMap.apk

      # Every new APK goes to VirusTotal (~70 antivirus engines) and the result
      # goes in the release notes. It shows no known engine flags the file — not
      # that it is clean; the source being public is what shows that. Needs the
      # `VT_API_KEY` secret (a free VirusTotal account's key); without it this
      # step says so and the build carries on. The public API allows 4 requests
      # a minute, so the result is asked every 20 s, for at most 8 minutes.
      - name: Scan the APK on VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "No VT_API_KEY secret: no scan this time."
            exit 0
          fi
          LINK="https://www.virustotal.com/gui/file/$APK_SHA256"
          # Files over 32 MB need an upload address of their own.
          UPLOAD=$(curl -sSf -H "x-apikey: $VT_API_KEY" \
            https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
          ANALYSIS=$(curl -sSf -H "x-apikey: $VT_API_KEY" -F "file=@PalmMap.apk" "$UPLOAD" \
            | jq -r .data.id)
          echo "Analysis $ANALYSIS"
          RESULT=""
          for _ in $(seq 1 24); do
            sleep 20
            RESULT=$(curl -sSf -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ANALYSIS" || true)
            [ "$(jq -r .data.attributes.status <<< "$RESULT")" = completed ] && break
          done
          if [ "$(jq -r .data.attributes.status <<< "$RESULT")" = completed ]; then
            BAD=$(jq '.data.attributes.stats | .malicious + .suspicious' <<< "$RESULT")
            ALL=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<< "$RESULT")
            echo "VirusTotal: $BAD of $ALL engines flag it — $LINK" | tee VT.md
          else
            echo "VirusTotal: scan still running — $LINK" | tee VT.md
          fi

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(du -h PalmMap.apk | cut -f1)
          VERSAO=$(jq -r '.expo.version' app.json)

          {
            echo "## What changed"
            echo
            cat MUDANCAS.md
            echo
            echo "## Install"
            echo
            echo "Download \`PalmMap.apk\` below and open it on the phone."
            echo "It is the full app: it installs over the previous one without losing"
            echo "settings, saved places or downloaded maps."
            echo
            echo "Version $VERSAO · $SIZE"
            echo
            echo "## Verify"
            echo
            echo "- SHA-256: \`$APK_SHA256\`"
            echo "- Built by GitHub Actions from commit ${{ github.sha }} of this public repository:"
            echo "  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Signed build provenance: \`gh attestation verify PalmMap.apk -R ${{ github.repository }}\`"
            echo "  (${{ github.server_url }}/${{ github.repository }}/attestations)"
            if [ -s VT.md ]; then
              echo "- $(cat VT.md)"
            fi
            if [ -n "$ANTERIOR" ]; then
              echo
              echo "Full changes: https://github.com/${{ github.repository }}/compare/$ANTERIOR...apk-${{ github.run_number }}"
            fi
          } > NOTAS.md
          cat NOTAS.md

          gh release create "apk-${{ github.run_number }}" PalmMap.apk \
            --title "PalmMap $VERSAO" \
            --notes-file NOTAS.md
