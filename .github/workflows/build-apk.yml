name: Build APK

# Builds the app on GitHub's servers and publishes the APK in a Release, so it
# can be downloaded and installed straight on the phone.
#
# Como usar: separador "Actions" > "Compilar APK" > "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags: without them there is no way to know
          # what changed since the previous build, and the list would be empty.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # The version comes from here, not from anyone's hand.
      #
      # `app.json` keeps only the meaningful part — the 7.0 of "version 7" — and
      # the last number is the build's. So **there are never two with the same
      # version**, whatever happens: there were once five in a row all saying the
      # same, because it depended on someone remembering to edit the file.
      #
      # The `versionCode` is the same thing for Android: without a new number, it
      # refuses to install over a previous version.
      - name: Number this version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const [maior, menor] = String(app.expo.version).split('.');
            app.expo.version = maior + '.' + menor + '.' + process.env.RUN_NUMBER;
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('This build\'s version: ' + app.expo.version);
          "

      # PalmMap's own signing key (author's decision, November 2026), from the
      # repository's secrets: the keystore in base64 and its password. It used
      # to be React Native's public debug key, which anyone has — anyone could
      # sign an APK Android would accept as an update of PalmMap. Without the
      # secrets the build stops here: a debug-signed APK after this would not
      # install over the ones signed with our key.
      - name: Put the signing key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.PALMMAP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PALMMAP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing the PALMMAP_KEYSTORE_BASE64 / PALMMAP_KEYSTORE_PASSWORD secrets."
            exit 1
          fi
          KS="$RUNNER_TEMP/palmmap.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # Fails here, clearly, if the file or the password is wrong.
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias palmmap > /dev/null
          {
            echo "PALMMAP_KEYSTORE=$KS"
            echo "PALMMAP_KEY_ALIAS=palmmap"
          } >> "$GITHUB_ENV"

      # The android/ folder is not in the repository — Expo generates it.
      # `plugins/withReleaseSigning.js` makes `release` sign with the key above.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # arm64-v8a and armeabi-v7a. arm64 alone was enough for the author's phone,
      # but a Samsung Galaxy A13 refused it as "not compatible" (November 2026):
      # cheap phones often run a 32-bit Android on a 64-bit processor. The two
      # x86 ones (emulators, a few old tablets) stay out — all four tripled the
      # size, and a huge APK is more likely to arrive truncated.
      - name: Build the APK
        working-directory: android
        env:
          PALMMAP_KEYSTORE_PASSWORD: ${{ secrets.PALMMAP_KEYSTORE_PASSWORD }}
          PALMMAP_KEY_PASSWORD: ${{ secrets.PALMMAP_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Confirms the APK came out whole and properly signed. Without this, a broken
      # file is only found on the phone, with a "problem parsing the package".
      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -t "$APK" > /dev/null && echo "Archive intact."

          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- identification ---"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|native-code"
          echo "--- signature ---"
          "$TOOLS/apksigner" verify --print-certs -v "$APK" | tee CERTS.txt
          if grep -q "CN=Android Debug" CERTS.txt; then
            echo "::error::The APK is signed with the public debug key, not PalmMap's."
            exit 1
          fi
          grep -m1 "certificate SHA-256 digest" CERTS.txt | awk '{print $NF}' > CERT_SHA.txt

      # When the signing key differs from the previous build's (the first build
      # with our own key, November 2026), Android refuses to install over the
      # old app — the release notes say to uninstall it first.
      - name: Compare the key with the previous build's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANTERIOR=$(gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("apk-"))' \
            | sort -t- -k2 -n | tail -1)
          [ -z "$ANTERIOR" ] && exit 0
          mkdir -p previous
          if ! gh release download "$ANTERIOR" -p PalmMap.apk -D previous; then
            exit 0
          fi
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OLD=$("$TOOLS/apksigner" verify --print-certs previous/PalmMap.apk \
            | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          if [ -n "$OLD" ] && [ "$OLD" != "$(cat CERT_SHA.txt)" ]; then
            echo "Signing key changed since $ANTERIOR."
            touch KEY_CHANGED
          fi
          rm -rf previous

      # The list of what changed since the previous build, taken from the commits.
      #
      # The previous build's tag is found by number — `apk-9` and `apk-10` do not
      # sort right as text, so they are sorted by the number after the dash.
      - name: Gather what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANTERIOR=$(gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("apk-"))' \
            | sort -t- -k2 -n | tail -1)

          if [ -n "$ANTERIOR" ] && git rev-parse "$ANTERIOR" > /dev/null 2>&1; then
            echo "Since $ANTERIOR:"
            # Only each commit's subject, without maintenance ones. `--no-merges`
            # removes the noise of branch merges.
            git log --no-merges --pretty=format:'- %s' "$ANTERIOR..HEAD" \
              | grep -viE '^- (merge|bump|wip|typo|formatar)' > MUDANCAS.md || true
          else
            echo "No identifiable previous build — first list."
            git log --no-merges --pretty=format:'- %s' -20 > MUDANCAS.md || true
          fi

          if [ ! -s MUDANCAS.md ]; then
            echo "- No code changes since the previous build." > MUDANCAS.md
          fi

          echo "ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"
          cat MUDANCAS.md

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk PalmMap.apk
          SIZE=$(du -h PalmMap.apk | cut -f1)
          SHA=$(sha256sum PalmMap.apk | cut -c1-16)
          VERSAO=$(jq -r '.expo.version' app.json)

          {
            echo "## What changed"
            echo
            cat MUDANCAS.md
            echo
            echo "## Install"
            echo
            if [ -f KEY_CHANGED ]; then
              echo "> **Uninstall the previous PalmMap first.** This version is signed with"
              echo "> a new key, and Android will not install it over the old one. Saved places"
              echo "> and downloaded maps are lost once; later versions update normally."
              echo
              echo "Download \`PalmMap.apk\` below and open it on the phone."
            else
              echo "Download \`PalmMap.apk\` below and open it on the phone."
              echo "It is the full app: it installs over the previous one without losing"
              echo "settings, saved places or downloaded maps."
            fi
            echo
            echo "Version $VERSAO · $SIZE · SHA-256 starts with \`$SHA\`"
            if [ -n "$ANTERIOR" ]; then
              echo
              echo "Full changes: https://github.com/${{ github.repository }}/compare/$ANTERIOR...apk-${{ github.run_number }}"
            fi
          } > NOTAS.md

          gh release create "apk-${{ github.run_number }}" PalmMap.apk \
            --title "PalmMap $VERSAO" \
            --notes-file NOTAS.md
