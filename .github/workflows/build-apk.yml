name: Compilar APK

# Compila a aplicação nos servidores do GitHub e publica o APK numa Release,
# para poder ser descarregado e instalado diretamente no telemóvel.
#
# Como usar: separador "Actions" > "Compilar APK" > "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico todo e as etiquetas: sem isto não há como saber o que
          # mudou desde a compilação anterior, e a lista sairia vazia.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      # Cada compilação fica com um número de versão próprio. Sem isto todas
      # saíam com versionCode 1, e o Android não as distingue umas das outras.
      - name: Numerar esta versão
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

      # A pasta android/ não está no repositório — é o Expo que a gera.
      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install

      # Só arm64-v8a: é o processador de qualquer telemóvel Android atual.
      # Incluir as quatro arquiteturas triplicava o tamanho do ficheiro sem
      # nenhum proveito, e um APK enorme é mais fácil de chegar truncado.
      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Confirma que o APK saiu inteiro e bem assinado. Sem isto, um ficheiro
      # estragado só se descobre no telemóvel, com um "erro ao analisar o pacote".
      - name: Verificar o APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -t "$APK" > /dev/null && echo "Arquivo íntegro."

          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- identificação ---"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|native-code"
          echo "--- assinatura ---"
          "$TOOLS/apksigner" verify --print-certs -v "$APK"

      # A lista do que mudou desde a compilação anterior, tirada dos commits.
      #
      # A etiqueta da compilação anterior descobre-se pela ordem em que o GitHub
      # as devolve — `apk-9` e `apk-10` não se ordenam bem por texto, por isso
      # ordena-se pelo número depois do travessão.
      - name: Reunir o que mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANTERIOR=$(gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("apk-"))' \
            | sort -t- -k2 -n | tail -1)

          if [ -n "$ANTERIOR" ] && git rev-parse "$ANTERIOR" > /dev/null 2>&1; then
            echo "Desde $ANTERIOR:"
            # Só o assunto de cada commit, sem os de manutenção nem os do próprio
            # changelog. O `--no-merges` tira o ruído das juntas de branches.
            git log --no-merges --pretty=format:'- %s' "$ANTERIOR..HEAD" \
              | grep -viE '^- (merge|bump|wip|typo|formatar)' > MUDANCAS.md || true
          else
            echo "Sem compilação anterior identificável — primeira lista."
            git log --no-merges --pretty=format:'- %s' -20 > MUDANCAS.md || true
          fi

          if [ ! -s MUDANCAS.md ]; then
            echo "- Sem alterações de código desde a compilação anterior." > MUDANCAS.md
          fi

          echo "ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"
          cat MUDANCAS.md

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk PalmMap.apk
          SIZE=$(du -h PalmMap.apk | cut -f1)
          SHA=$(sha256sum PalmMap.apk | cut -c1-16)
          VERSAO=$(jq -r '.expo.version' app.json)

          {
            echo "## O que mudou"
            echo
            cat MUDANCAS.md
            echo
            echo "## Instalar"
            echo
            echo "Descarregue o \`PalmMap.apk\` aqui em baixo e abra-o no telemóvel."
            echo "É a aplicação completa: instala por cima da anterior sem perder as"
            echo "definições, os favoritos nem os mapas já descarregados."
            echo
            echo "Versão $VERSAO · $SIZE · início do SHA-256: \`$SHA\`"
            if [ -n "$ANTERIOR" ]; then
              echo
              echo "Alterações a detalhe: https://github.com/${{ github.repository }}/compare/$ANTERIOR...apk-${{ github.run_number }}"
            fi
          } > NOTAS.md

          gh release create "apk-${{ github.run_number }}" PalmMap.apk \
            --title "PalmMap $VERSAO — APK ${{ github.run_number }}" \
            --notes-file NOTAS.md
