name: Build timetables

# Converts static GTFS timetables into a compact file and publishes it in a
# Release, for the app to download and use — as the offline maps workflow does
# with countries.
#
# Why: trains, the metro and ferries have no open real-time API. What they have
# is static GTFS, a ZIP with the whole timetable, which cannot be used directly
# on a phone — CP's has hundreds of thousands of lines. The conversion is done
# here, once, and the phone gets a small file.
#
# ## Modes
#
# **gerar** — downloads, converts and publishes. Each operator is tried on its
# own: one failing does not take the others down.
#
# **descobrir** — generates nothing. Searches dados.gov.pt and prints the GTFS
# addresses it finds, and knocks on the TML API to see which addresses answer
# without a key.
#
# **veiculos**, **passagens**, **trajetos**, **sondar** — read-only probes that
# publish nothing (see each step).
#
# ## Run again now and then
#
# Timetables change, and the generated window is sixty days. This should run
# once a month. It is not scheduled on purpose — the author asked that nothing
# build by itself.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'What to do'
        type: choice
        options: [gerar, descobrir, veiculos, passagens, trajetos, sondar]
        default: gerar
      operadores:
        description: 'Space-separated ids (see transit-feeds.json). "todos" does the whole catalogue.'
        default: 'todos'
      dias:
        description: 'How many days of timetable to keep'
        default: '60'
      sondar:
        description: 'Probe mode only: which checks to run (arrivals vehicles light_rail satellite mts). Empty runs all.'
        default: ''

permissions:
  contents: write

jobs:
  horarios:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only Python's standard library — nothing to install.
      - name: Look for GTFS addresses and probe the TML API
        if: inputs.modo == 'descobrir'
        run: python3 scripts/build-transit.py --descobrir

      # Short output, only the bus positions. What decides whether they can go on
      # the map is the Content-Type: JSON comes free, Protobuf would need a new
      # library.
      - name: Probe the bus positions
        if: inputs.modo == 'veiculos'
        run: python3 scripts/build-transit.py --veiculos

      # Read-only probe: raw arrivals, vehicle timestamps, Metro Sul do Tejo
      # stations and which satellite editions exist. Publishes nothing.
      - name: Probe services
        if: inputs.modo == 'sondar'
        run: python3 scripts/probe.py ${{ inputs.sondar }}

      - name: Probe the bus arrivals
        if: inputs.modo == 'passagens'
        run: python3 scripts/build-transit.py --passagens

      # The app's trip planning — its own code, not a copy — running against the
      # real API. Only what is needed is compiled, in a separate folder:
      # installing all the app's dependencies would bring the whole of React
      # Native to run one file.
      - uses: actions/setup-node@v4
        if: inputs.modo == 'trajetos'
        with:
          node-version: '22'

      - name: Try bus trips with the app's code
        if: inputs.modo == 'trajetos'
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          npm init -y > /dev/null
          npm install --no-audit --no-fund axios@1 typescript@6.0.3 > /dev/null
          # Compiled from /tmp/t, where there is no tsconfig.json: given a file by
          # hand, tsc refuses to run next to one.
          node_modules/.bin/tsc "$GITHUB_WORKSPACE/src/services/transit.ts" \
            --rootDir "$GITHUB_WORKSPACE/src" --outDir /tmp/t/out \
            --module commonjs --target es2020 --skipLibCheck --esModuleInterop \
            --moduleResolution node || true
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/t/node_modules node scripts/probe-trips.js /tmp/t/out

      - name: Convert the timetables
        if: inputs.modo == 'gerar'
        run: |
          python3 scripts/build-transit.py \
            --ids "${{ inputs.operadores }}" \
            --dias "${{ inputs.dias }}" \
            --saida horarios

      # The list is what the app reads to know what exists. What was already
      # there is merged with this run's, otherwise generating only CP would erase
      # the others — the same trap as in the maps workflow.
      - name: Publish
        if: inputs.modo == 'gerar'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail

          if ! gh release view horarios -R "$REPO" > /dev/null 2>&1; then
            gh release create horarios -R "$REPO" \
              --title "Timetables" --notes "Generating…"
          fi

          for FICHEIRO in horarios/*.json; do
            [ "$(basename "$FICHEIRO")" = "lote.json" ] && continue
            gh release upload horarios "$FICHEIRO" -R "$REPO" --clobber
          done

          if gh release download horarios -R "$REPO" -p horarios.json -O anterior.json 2>/dev/null; then
            echo "Already there: $(jq '.horarios | length' anterior.json) operator(s)."
          else
            echo '{"horarios":[]}' > anterior.json
          fi

          # On a repeat, this run's wins, being the newest.
          jq -s '{horarios: (.[0].horarios + .[1].horarios)
                    | group_by(.id)
                    | map(.[-1])
                    | sort_by(.nome)}' anterior.json horarios/lote.json > horarios.json

          jq -r '.horarios[] | "  \(.nome): \(.estacoes) stations, \(.bytes/1024 | floor) KB, until \(.fim)"' horarios.json

          gh release upload horarios horarios.json -R "$REPO" --clobber

          gh release edit horarios -R "$REPO" \
            --title "Timetables" \
            --notes "Train, metro, ferry and light-rail timetables, converted from each operator's static GTFS.

          The app downloads them in Settings, under \"Timetables\". They are small files and work offline.

          Valid until the date shown — after that the workflow has to run again.

          $(jq -r '.horarios[] | "- \(.nome): \(.estacoes) stations, \(.bytes/1024 | floor) KB, until \(.fim)"' horarios.json)"
